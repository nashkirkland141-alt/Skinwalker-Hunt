
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skinwalker: The Hunt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section id="auth" class="screen">
    <div class="panel">
      <div class="eyebrow">NIGHTFALL STUDIOS</div>
      <h1>SKINWALKER<br><span>THE HUNT</span></h1>
      <p>Something is watching from the trees.</p>

      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">

      <button id="login">LOG IN</button>
      <button id="signup" class="secondary">CREATE ACCOUNT</button>
      <div id="authMessage" class="message"></div>
    </div>
  </section>

  <section id="lobby" class="screen hidden">
    <div class="panel">
      <div class="eyebrow">MULTIPLAYER SURVIVAL</div>
      <h1>ENTER THE FOREST</h1>
      <p id="welcome"></p>

      <button id="createRoom">CREATE ROOM</button>
      <input id="roomCode" placeholder="ROOM CODE" maxlength="8">
      <button id="joinRoom" class="secondary">JOIN ROOM</button>
      <button id="logout" class="quiet">LOG OUT</button>
      <div id="lobbyMessage" class="message"></div>
    </div>
  </section>

  <main id="gameScreen" class="hidden">
    <div id="world"></div>

    <div class="hud">
      <div class="brand">SKINWALKER <span>THE HUNT</span></div>
      <div id="roomLabel">ROOM: ----</div>
      <div id="roleLabel">ROLE: WAITING</div>
    </div>

    <div class="sanity">
      <div>SANITY</div>
      <div class="bar"><div id="sanityFill"></div></div>
      <span id="sanityNumber">100%</span>
    </div>

    <div id="crosshair">+</div>
    <div id="message"></div>

    <div class="bottomHUD">
      <div id="objective">Find the others.</div>
      <small>WASD MOVE · MOUSE LOOK · CLICK FIRE</small>
    </div>

    <div id="mobileControls">
      <div id="joystick"><div id="stick"></div></div>
      <button id="fireButton">FIRE</button>
    </div>

    <button id="leave">LEAVE MATCH</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
